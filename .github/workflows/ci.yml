name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Sentinel.slnx
      - name: Build
        run: dotnet build Sentinel.slnx -c Release --no-restore
      - name: Domain checks
        run: dotnet run --project tests/Sentinel.Domain.Tests/Sentinel.Domain.Tests.csproj -c Release --no-build
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          SENTINEL_INGEST_TOKEN: ci-placeholder-token
        run: docker compose config --quiet
