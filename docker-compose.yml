services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        APP_PROJECT: Sentinel.Api
    restart: unless-stopped
    environment: &app_environment
      ConnectionStrings__Sentinel: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinel};Username=${POSTGRES_USER:-sentinel};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Sentinel__IngestToken: ${SENTINEL_INGEST_TOKEN:?Set SENTINEL_INGEST_TOKEN in .env}
      WhatsApp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        APP_PROJECT: Sentinel.Worker
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
